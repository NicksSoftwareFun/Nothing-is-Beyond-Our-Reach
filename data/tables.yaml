# Master rules tables — single source of truth (design/design-bible.md is the spec).
# Schema per entry: {title, dice?, columns: [...], rows: [[...]], note?}
# This file is owned by the lead designer. Chapter agents REFERENCE tables via {{table:id}};
# they do not edit this file. New-table requests go in the chapter agent's report.

modifiers:
  title: Attack & Test Modifiers (complete list)
  columns: [Situation, Modifier]
  rows:
    - ["Snap Shot (2 AP)", "+3 TN"]
    - ["Reaction Fire (always a Snap Shot)", "+3 TN total"]
    - ["Shooter is Shaken", "+2 TN"]
    - ["Target Sprinting (this or its last activation)", "+2 TN"]
    - ["Beyond Effective Range (up to 2x)", "+2 TN"]
    - ["Beyond 2x Effective Range", "no shot (Scoped: +4 TN)"]
    - ["Smoke / heavy rain / darkness without lights", "+2 TN"]
    - ["Braced (Aimed, no movement, supported)", "-1 TN"]
    - ["Elevated shooter", "-1 TN"]
    - ["Point Blank (adjacent square or same Zone)", "-2 TN"]
  note: There are no other tactical modifiers. Maximum net +6 / -3. Cover is never a modifier — use the printed Cover TN.

ap-costs:
  title: Universal Action Point Costs
  columns: [Action, AP, Notes]
  rows:
    - ["Walk 1 square", "1", "quiet"]
    - ["Sprint (3 squares, at most 1 turn point)", "2", "+1 Noise per activation; Sprinting target +2 TN to hit"]
    - ["Crawl 1 square (prone)", "2", "counts as Cover vs shots from 3+ squares"]
    - ["Go prone / stand", "1", ""]
    - ["Snap Shot", "2", "+3 TN"]
    - ["Aimed Shot", "4", "printed TN"]
    - ["Braced Shot", "5", "-1 TN; no movement this activation"]
    - ["Reload", "2", "3 for crew-served"]
    - ["Throw grenade", "3", ""]
    - ["Open door / climb window", "1 / 2", ""]
    - ["Kick breach", "2", "+2 Noise"]
    - ["Enter or exit a Zone through a Portal", "2", ""]
    - ["Buddy Aid", "4", "Medicine test; EMT 3 AP"]
    - ["Rally (Leader, radius 3)", "2", ""]
    - ["Spot (resolve a Blip in LOS / search)", "2", ""]
    - ["Mount / dismount vehicle", "2", ""]
    - ["Interact (cut wire, plant charge, grab cache...)", "2", "unless scenario states otherwise"]
  note: Facing changes are free while spending AP. Unspent AP remains for Reaction Fire (Overwatch).

hit-location:
  title: Hit Location (Crew figures)
  dice: d10
  columns: [d10, Location, Location effect]
  rows:
    - ["1", "Head", "+2 Severity; helmet Armor 2 if worn"]
    - ["2", "Weapon arm", "on Light+: one-handed — long guns +3 TN"]
    - ["3", "Off arm", "on Light+: one-handed — long guns +3 TN"]
    - ["4-7", "Torso", "plates Armor 3 if worn"]
    - ["8-0", "Legs", "on Light+: no Sprint"]

severity:
  title: Wound Severity (d10 + weapon DR - armor at location)
  dice: d10
  columns: [Result, Wound, Immediate effect]
  rows:
    - ["4 or less", "Graze", "Shaken"]
    - ["5-7", "Light", "Shaken; -2 max AP; Bleed 1; limb effects per location"]
    - ["8-10", "Serious", "Fall prone, Shaken; half AP; Bleed 2; Grit test each activation to act beyond Crawl/self-aid"]
    - ["11+", "Critical", "Down and Dying — bleed-out clock d6+2 turns; unconscious; second Critical = dead"]
  note: Wounds stack — a second Light applies Serious effects; a second Serious applies Critical.

opfor-casualty:
  title: OPFOR Casualty Die (d10 + weapon DR - Armor)
  dice: d10
  columns: [Result, Effect]
  rows:
    - ["3 or less", "Staggered — Shaken; if already Shaken, Pinned"]
    - ["4-6", "Down — out of the fight; may be stabilized for capture"]
    - ["7+", "Dead"]
  note: Natural 20 on the attack — Dead, no roll. Support units (drivers, porters) roll at -1.

vehicle-damage:
  title: Vehicle Damage Die (d10 + weapon Pen - Armor)
  dice: d10
  columns: [Result, Effect]
  rows:
    - ["3 or less", "Rattled — occupants Shaken; cosmetic damage"]
    - ["4-5", "Mobility hit — Speed halved; second Mobility = immobilized"]
    - ["6-7", "Weapon / exposed hit — mounted weapon disabled or one exposed occupant hit (random)"]
    - ["8-9", "Crew hit — driver or one occupant (random) takes a direct hit at +2"]
    - ["10+", "Wreck — destroyed; occupants take a DR 3 hit and bail adjacent; 12+ it burns"]
  note: "Pen cap: against Armor 2+, a weapon with Pen below 2 treats any result above 5 as 5."

contact-default:
  title: Default Contact Table (resolving a Blip)
  dice: d10
  columns: [d10, Contact]
  rows:
    - ["1-2", "Nothing — a dog, wind, refugees moving through. Remove the Blip"]
    - ["3-5", "Patrol pair (2 figures, standing Doctrine: Sweep)"]
    - ["6-7", "Fireteam (4 figures with Leader, Doctrine: per scenario)"]
    - ["8", "Sentry post + MMG team (Doctrine: Holding / Base-of-Fire)"]
    - ["9", "Drone team (operator + RTO; launches recon quad next Warden Phase)"]
    - ["10", "Special — see scenario"]
  note: Under ALARM add +2. Scenarios may replace this table.

alert-states:
  title: The Alert Ladder
  columns: [State, Trigger, Warden behavior]
  rows:
    - ["Unaware", "start of most missions", "standing posture — posts and patrol routes; no Directives"]
    - ["Suspicious", "Noise at threshold (default 3), or an unresolved sighting", "nearest element investigates newest Noise; Blips drift toward Noise"]
    - ["Alerted", "Noise at threshold (default 7), or clear contact", "Directive card each Warden Phase; elements act by Doctrine against Known positions"]
    - ["ALARM", "Leader/RTO with working comms spends 2 AP (auto at a fixed set; 2d10 >= 12 on manpack under fire) — or scenario fallback timer", "QRF clock d6+2 turns; Blips +2 on Contact rolls; OPFOR drones launch"]
  note: ALARM is a human act. Kill the leaders, cut the wire, jam the net — or it is coming.

noise-sources:
  title: Noise Sources
  columns: [Source, Noise]
  rows:
    - ["Unsuppressed gunshot", "+2 (max +3 per turn from gunfire)"]
    - ["Suppressed shot", "+1 (max +1 per turn)"]
    - ["Sprint", "+1 per figure-activation"]
    - ["Kick breach", "+2"]
    - ["Explosion / crash", "+3"]
    - ["Vehicle engine moving on board", "+2 per turn"]
    - ["Crew drone aloft", "+1 per turn"]
    - ["Body discovered by the Warden", "+3 and Suspicious"]
  note: Noise never decreases during a mission.

interrupt-die:
  title: The Interrupt Die
  dice: d10
  columns: [After Crew activation number..., Warden interrupts on]
  rows:
    - ["2nd", "10"]
    - ["3rd", "9+"]
    - ["4th", "8+"]
    - ["5th", "7+"]
    - ["6th", "6+"]
    - ["7th", "5+"]
    - ["8th", "4+"]
  note: Max one Interrupt per turn — the nearest revealed element (Alerted first) acts with 4 AP. It still acts in the Warden Phase.

skill-tiers:
  title: Crew Skill Tiers (reference)
  columns: [Tier, "Shoot Open/Cover", Grit, Who]
  rows:
    - ["SOF vet", "8/10", "8", "one or two per campaign roster"]
    - ["Service vet / trained", "10/12", "10", "infantry vets, deputies"]
    - ["Skilled civilian", "11/13", "11", "hunters, competent shooters"]
    - ["Green", "13/15", "12", "most starting civilians"]

beaten-zone:
  title: Beaten Zone (Sustained Fire)
  columns: [Property, Rule]
  rows:
    - ["Template", "2 x 4 squares, long axis along the line of fire, nearest edge at the target square, fully in LOS"]
    - ["Attack", "one roll at TN 11 (no Cover TN — the BZ ignores low cover along its axis)"]
    - ["On success", "every figure in the BZ takes a hit at DR 4"]
    - ["Success or fail", "every figure in the BZ is Shaken unless prone"]
    - ["Persistence", "BZ marker stays until the gun moves, reloads, or shifts fire"]
    - ["Crossing", "double AP per square inside; one immediate attack at TN 13 per square entered"]
    - ["Belt", "3 Sustained Fire actions, then Reload (3 AP with AG; 5 AP without, jam on natural 4 or less)"]
