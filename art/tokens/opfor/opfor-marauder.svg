<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-nibor="tokens/opfor/opfor-marauder">
  <!-- Marauder - rust ring, standard body, bare head, shotgun, no badge. -->
  <!-- base ring: marauder (c-ring-marauder) -->
  <circle cx="50" cy="50" r="46" fill="#F8F6EE" stroke="#9C4A38" stroke-width="6"/>
  <!-- c-body-standard (recolored marauder) - hands drawn over the weapon below -->
  <g id="c-body-standard">
    <rect x="-4.5" y="-16" width="9" height="32" rx="4.5" fill="#9C4A38" stroke="#2B2A26" stroke-width="3" transform="translate(42.75,36) rotate(22)"/>
    <rect x="-4.5" y="-12" width="9" height="24" rx="4.5" fill="#9C4A38" stroke="#2B2A26" stroke-width="3" transform="translate(57.25,42) rotate(-36)"/>
    <ellipse cx="50" cy="55" rx="27" ry="16" fill="#9C4A38" stroke="#2B2A26" stroke-width="3"/>
  </g>
  <!-- c-head-bare -->
  <g id="c-head-bare">
    <circle cx="50" cy="50" r="11" fill="#C9BA95" stroke="#2B2A26" stroke-width="3"/>
  </g>
  <!-- c-weapon-shotgun -->
  <g id="c-weapon-shotgun">
    <rect x="47.2" y="6" width="5.6" height="4" fill="#2B2A26"/><rect x="48.5" y="10" width="3" height="32" fill="#2B2A26"/><rect x="45" y="40" width="10" height="16" rx="2.5" fill="#2B2A26"/><rect x="46.2" y="56" width="7.6" height="13" rx="1" fill="#2B2A26"/><polygon points="46.6,69 53.4,69 55.6,89 44.4,89" fill="#2B2A26"/><rect x="43.8" y="89" width="12.4" height="4" rx="1.2" fill="#2B2A26"/>
  </g>
  <!-- hands on the weapon (from c-body-standard, drawn over the weapon) -->
  <circle cx="47.5" cy="26" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <circle cx="52.5" cy="39" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- c-blind-notch (rear) -->
  <g id="c-blind-notch"><path d="M40.5,83 L50,91.5 L59.5,83 L59.5,76 L50,84.5 L40.5,76 Z" fill="#2B2A26"/></g>
</svg>
