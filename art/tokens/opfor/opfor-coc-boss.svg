<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-nibor="tokens/opfor/opfor-coc-boss">
  <!-- COC boss - civil-order ring, heavy body (scrounged plates) + cap, battle rifle, leader badge. -->
  <!-- base ring: civil-order (c-ring-civil-order) -->
  <circle cx="50" cy="50" r="46" fill="#F8F6EE" stroke="#6E7480" stroke-width="6"/>
  <!-- c-body-heavy (recolored civil-order) - hands drawn over the weapon below -->
  <g id="c-body-heavy">
    <rect x="-5" y="-17" width="10" height="34" rx="5" fill="#6E7480" stroke="#2B2A26" stroke-width="3" transform="translate(41.5,35.5) rotate(23)"/>
    <rect x="-5" y="-13" width="10" height="26" rx="5" fill="#6E7480" stroke="#2B2A26" stroke-width="3" transform="translate(58.5,42) rotate(-36)"/>
    <ellipse cx="50" cy="55" rx="31" ry="18" fill="#6E7480" stroke="#2B2A26" stroke-width="3"/>
    <polygon points="34,43 66,43 71.5,50 71.5,64 65.5,71 34.5,71 28.5,64 28.5,50" fill="#6E7480" stroke="#2B2A26" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- c-head-cap (recolored civil-order) -->
  <g id="c-head-cap">
    <path d="M35.5,44.24 A16,16 0 0 1 64.5,44.24 L58.61,46.99 A9.5,9.5 0 0 0 41.39,46.99 Z" fill="#6E7480" stroke="#2B2A26" stroke-width="1.5"/>
    <circle cx="50" cy="51" r="11" fill="#6E7480" stroke="#2B2A26" stroke-width="3"/>
    <circle cx="50" cy="51" r="1.8" fill="#2B2A26"/>
  </g>
  <!-- c-weapon-battle-rifle -->
  <g id="c-weapon-battle-rifle">
    <rect x="47.8" y="4" width="4.4" height="5" fill="#2B2A26"/><rect x="48.6" y="9" width="2.8" height="11" fill="#2B2A26"/><rect x="45.8" y="19.5" width="8.4" height="2.8" fill="#2B2A26"/><rect x="45.4" y="22.3" width="9.2" height="24" rx="4" fill="#2B2A26"/><rect x="44.4" y="46.3" width="11.2" height="17" rx="1" fill="#2B2A26"/><rect x="55.6" y="48.7" width="4.4" height="3.2" rx="1.2" fill="#2B2A26"/><polygon points="45.4,63.3 54.6,63.3 56.8,92 43.2,92" fill="#2B2A26"/><rect x="42.8" y="92" width="14.4" height="4" rx="1.2" fill="#2B2A26"/>
  </g>
  <!-- hands on the weapon (from c-body-heavy, drawn over the weapon) -->
  <circle cx="47.2" cy="24" r="4.4" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <circle cx="52.8" cy="34" r="4.4" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- role badge: leader (glyph in faction color per style-guide 4.1) -->
  <rect x="71.5" y="71.5" width="22" height="22" rx="3" fill="#F8F6EE" stroke="#2B2A26" stroke-width="1.5"/>
  <g id="c-glyph-leader" transform="translate(73.7,73.7) scale(0.45)"><path d="M8,17.5 L20,6 L32,17.5 L32,24.5 L20,13 L8,24.5 Z" fill="#6E7480"/><path d="M8,29.5 L20,18 L32,29.5 L32,36.5 L20,25 L8,36.5 Z" fill="#6E7480"/></g>
  <!-- c-blind-notch (rear) -->
  <g id="c-blind-notch"><path d="M40.5,83 L50,91.5 L59.5,83 L59.5,76 L50,84.5 L40.5,76 Z" fill="#2B2A26"/></g>
</svg>
