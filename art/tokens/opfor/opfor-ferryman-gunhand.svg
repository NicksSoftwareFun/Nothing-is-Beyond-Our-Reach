<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-nibor="tokens/opfor/opfor-ferryman-gunhand">
  <!-- Ferryman gunhand - water-blue ring, standard body + hood, SMG, no badge. -->
  <!-- base ring: ferrymen (c-ring-ferrymen) -->
  <circle cx="50" cy="50" r="46" fill="#F8F6EE" stroke="#7A97A0" stroke-width="6"/>
  <!-- c-body-standard (recolored ferrymen) - hands drawn over the weapon below -->
  <g id="c-body-standard">
    <rect x="-4.5" y="-16" width="9" height="32" rx="4.5" fill="#7A97A0" stroke="#2B2A26" stroke-width="3" transform="translate(42.75,36) rotate(22)"/>
    <rect x="-4.5" y="-12" width="9" height="24" rx="4.5" fill="#7A97A0" stroke="#2B2A26" stroke-width="3" transform="translate(57.25,42) rotate(-36)"/>
    <ellipse cx="50" cy="55" rx="27" ry="16" fill="#7A97A0" stroke="#2B2A26" stroke-width="3"/>
  </g>
  <!-- c-head-hood (recolored ferrymen) -->
  <g id="c-head-hood">
    <path d="M50,33.5 C60,36.5 64.5,44 64.5,51.5 C64.5,59.5 58,65 50,65 C42,65 35.5,59.5 35.5,51.5 C35.5,44 40,36.5 50,33.5 Z" fill="#7A97A0" stroke="#2B2A26" stroke-width="3"/>
    <ellipse cx="50" cy="52.5" rx="7" ry="6.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  </g>
  <!-- c-weapon-smg -->
  <g id="c-weapon-smg">
    <rect x="48.4" y="21" width="3.2" height="10" fill="#2B2A26"/><rect x="44" y="31" width="12" height="26" rx="2" fill="#2B2A26"/><rect x="40.6" y="37" width="3.4" height="7" rx="1" fill="#2B2A26"/><rect x="45.4" y="57" width="2.4" height="17" fill="#2B2A26"/><rect x="52.2" y="57" width="2.4" height="17" fill="#2B2A26"/><rect x="43.8" y="73" width="12.4" height="4" rx="1.5" fill="#2B2A26"/>
  </g>
  <!-- hands on the weapon (from c-body-standard, drawn over the weapon) -->
  <circle cx="47.5" cy="27" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <circle cx="52.5" cy="37" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- c-blind-notch (rear) -->
  <g id="c-blind-notch"><path d="M40.5,83 L50,91.5 L59.5,83 L59.5,76 L50,84.5 L40.5,76 Z" fill="#2B2A26"/></g>
</svg>
