<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-nibor="tokens/opfor/opfor-eca-marksman">
  <!-- ECA marksman - authority ring, standard body + cap, scoped hunting rifle, crosshair badge. -->
  <!-- base ring: authority (c-ring-authority) -->
  <circle cx="50" cy="50" r="46" fill="#F8F6EE" stroke="#4A4E57" stroke-width="6"/>
  <!-- c-body-standard (recolored authority) - hands drawn over the weapon below -->
  <g id="c-body-standard">
    <rect x="-4.5" y="-16" width="9" height="32" rx="4.5" fill="#4A4E57" stroke="#2B2A26" stroke-width="3" transform="translate(42.75,36) rotate(22)"/>
    <rect x="-4.5" y="-12" width="9" height="24" rx="4.5" fill="#4A4E57" stroke="#2B2A26" stroke-width="3" transform="translate(57.25,42) rotate(-36)"/>
    <ellipse cx="50" cy="55" rx="27" ry="16" fill="#4A4E57" stroke="#2B2A26" stroke-width="3"/>
  </g>
  <!-- c-head-cap (recolored authority) -->
  <g id="c-head-cap">
    <path d="M35.5,44.24 A16,16 0 0 1 64.5,44.24 L58.61,46.99 A9.5,9.5 0 0 0 41.39,46.99 Z" fill="#4A4E57" stroke="#2B2A26" stroke-width="1.5"/>
    <circle cx="50" cy="51" r="11" fill="#4A4E57" stroke="#2B2A26" stroke-width="3"/>
    <circle cx="50" cy="51" r="1.8" fill="#2B2A26"/>
  </g>
  <!-- c-weapon-hunting-rifle -->
  <g id="c-weapon-hunting-rifle">
    <rect x="48" y="6" width="4" height="3" fill="#2B2A26"/><rect x="48.7" y="9" width="2.6" height="27" fill="#2B2A26"/><rect x="46.4" y="25.5" width="7.2" height="13" rx="3" fill="#2B2A26"/><rect x="47" y="38" width="6" height="24" fill="#2B2A26"/><rect x="44.6" y="39.5" width="10.8" height="7.5" rx="3.4" fill="#2B2A26"/><rect x="47.4" y="47" width="5.2" height="8.5" fill="#2B2A26"/><rect x="45.2" y="55.5" width="9.6" height="5.5" rx="2.4" fill="#2B2A26"/><rect x="53" y="48.5" width="5.6" height="3" rx="1.4" fill="#2B2A26"/><polygon points="46.4,62 53.6,62 55.8,92 44.2,92" fill="#2B2A26"/><rect x="43.8" y="92" width="12.4" height="4" rx="1.2" fill="#2B2A26"/>
  </g>
  <!-- hands on the weapon (from c-body-standard, drawn over the weapon) -->
  <circle cx="47.5" cy="27" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <circle cx="52.5" cy="35" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- role badge: crosshair (glyph in faction color per style-guide 4.1) -->
  <rect x="71.5" y="71.5" width="22" height="22" rx="3" fill="#F8F6EE" stroke="#2B2A26" stroke-width="1.5"/>
  <g id="c-glyph-crosshair" transform="translate(73.7,73.7) scale(0.45)"><circle cx="20" cy="20" r="11.5" fill="none" stroke="#4A4E57" stroke-width="3"/><line x1="20" y1="2.5" x2="20" y2="10" stroke="#4A4E57" stroke-width="3"/><line x1="20" y1="30" x2="20" y2="37.5" stroke="#4A4E57" stroke-width="3"/><line x1="2.5" y1="20" x2="10" y2="20" stroke="#4A4E57" stroke-width="3"/><line x1="30" y1="20" x2="37.5" y2="20" stroke="#4A4E57" stroke-width="3"/><circle cx="20" cy="20" r="2.6" fill="#4A4E57"/></g>
  <!-- c-blind-notch (rear) -->
  <g id="c-blind-notch"><path d="M40.5,83 L50,91.5 L59.5,83 L59.5,76 L50,84.5 L40.5,76 Z" fill="#2B2A26"/></g>
</svg>
