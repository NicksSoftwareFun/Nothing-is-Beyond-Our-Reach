<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-nibor="tokens/opfor/opfor-compact-fighter">
  <!-- Compact fighter - dull-green ring, standard body + hood (hunting gear), battle rifle, no badge. -->
  <!-- base ring: compact (c-ring-compact) -->
  <circle cx="50" cy="50" r="46" fill="#F8F6EE" stroke="#6B7A4B" stroke-width="6"/>
  <!-- c-body-standard (recolored compact) - hands drawn over the weapon below -->
  <g id="c-body-standard">
    <rect x="-4.5" y="-16" width="9" height="32" rx="4.5" fill="#6B7A4B" stroke="#2B2A26" stroke-width="3" transform="translate(42.75,36) rotate(22)"/>
    <rect x="-4.5" y="-12" width="9" height="24" rx="4.5" fill="#6B7A4B" stroke="#2B2A26" stroke-width="3" transform="translate(57.25,42) rotate(-36)"/>
    <ellipse cx="50" cy="55" rx="27" ry="16" fill="#6B7A4B" stroke="#2B2A26" stroke-width="3"/>
  </g>
  <!-- c-head-hood (recolored compact) -->
  <g id="c-head-hood">
    <path d="M50,33.5 C60,36.5 64.5,44 64.5,51.5 C64.5,59.5 58,65 50,65 C42,65 35.5,59.5 35.5,51.5 C35.5,44 40,36.5 50,33.5 Z" fill="#6B7A4B" stroke="#2B2A26" stroke-width="3"/>
    <ellipse cx="50" cy="52.5" rx="7" ry="6.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  </g>
  <!-- c-weapon-battle-rifle -->
  <g id="c-weapon-battle-rifle">
    <rect x="47.8" y="4" width="4.4" height="5" fill="#2B2A26"/><rect x="48.6" y="9" width="2.8" height="11" fill="#2B2A26"/><rect x="45.8" y="19.5" width="8.4" height="2.8" fill="#2B2A26"/><rect x="45.4" y="22.3" width="9.2" height="24" rx="4" fill="#2B2A26"/><rect x="44.4" y="46.3" width="11.2" height="17" rx="1" fill="#2B2A26"/><rect x="55.6" y="48.7" width="4.4" height="3.2" rx="1.2" fill="#2B2A26"/><polygon points="45.4,63.3 54.6,63.3 56.8,92 43.2,92" fill="#2B2A26"/><rect x="42.8" y="92" width="14.4" height="4" rx="1.2" fill="#2B2A26"/>
  </g>
  <!-- hands on the weapon (from c-body-standard, drawn over the weapon) -->
  <circle cx="47.5" cy="24" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <circle cx="52.5" cy="34" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- c-blind-notch (rear) -->
  <g id="c-blind-notch"><path d="M40.5,83 L50,91.5 L59.5,83 L59.5,76 L50,84.5 L40.5,76 Z" fill="#2B2A26"/></g>
</svg>
