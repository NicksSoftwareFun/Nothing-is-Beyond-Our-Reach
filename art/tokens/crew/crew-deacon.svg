<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-nibor="tokens/crew/crew-deacon">
  <!-- Dale "Deacon" McAllister - SOF vet, point man. Standard body, cap, carbine. -->
  <!-- base ring: crew (c-ring-crew) -->
  <circle cx="50" cy="50" r="46" fill="#F8F6EE" stroke="#D96C2E" stroke-width="6"/>
  <g id="c-body-standard">
    <rect x="-4.5" y="-16" width="9" height="32" rx="4.5" fill="#5B6244" stroke="#2B2A26" stroke-width="3" transform="translate(42.75,36) rotate(22)"/>
    <rect x="-4.5" y="-12" width="9" height="24" rx="4.5" fill="#5B6244" stroke="#2B2A26" stroke-width="3" transform="translate(57.25,42) rotate(-36)"/>
    <ellipse cx="50" cy="55" rx="27" ry="16" fill="#5B6244" stroke="#2B2A26" stroke-width="3"/>
  </g>
  <g id="c-head-cap">
    <path d="M35.5,44.24 A16,16 0 0 1 64.5,44.24 L58.61,46.99 A9.5,9.5 0 0 0 41.39,46.99 Z" fill="#5B6244" stroke="#2B2A26" stroke-width="1.5"/>
    <circle cx="50" cy="51" r="11" fill="#5B6244" stroke="#2B2A26" stroke-width="3"/>
    <circle cx="50" cy="51" r="1.8" fill="#2B2A26"/>
  </g>
  <g id="c-weapon-carbine">
    <rect x="47.8" y="12" width="4.4" height="5" fill="#2B2A26"/><rect x="48.6" y="17" width="2.8" height="9" fill="#2B2A26"/><rect x="45.4" y="25.5" width="9.2" height="2.8" fill="#2B2A26"/><rect x="45.9" y="28.3" width="8.2" height="18" rx="2" fill="#2B2A26"/><rect x="44.4" y="46.3" width="11.2" height="16" rx="1.2" fill="#2B2A26"/><rect x="55.6" y="49.5" width="2.8" height="7" fill="#2B2A26"/><rect x="47.4" y="62.3" width="5.2" height="11" fill="#2B2A26"/><polygon points="44.8,73.3 55.2,73.3 56.6,85 43.4,85" fill="#2B2A26"/><rect x="42.6" y="85" width="14.8" height="3.6" rx="1" fill="#2B2A26"/>
  </g>
  <!-- hands on the grip (from c-body-standard, drawn over the weapon) -->
  <circle cx="47.2" cy="24" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <circle cx="52.8" cy="34" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- role badge: leader -->
  <rect x="71.5" y="71.5" width="22" height="22" rx="3" fill="#F8F6EE" stroke="#2B2A26" stroke-width="1.5"/>
  <g id="c-glyph-leader" transform="translate(73.7,73.7) scale(0.45)"><path d="M8,17.5 L20,6 L32,17.5 L32,24.5 L20,13 L8,24.5 Z" fill="#2B2A26"/><path d="M8,29.5 L20,18 L32,29.5 L32,36.5 L20,25 L8,36.5 Z" fill="#2B2A26"/></g>
  <!-- c-blind-notch (rear) -->
  <g id="c-blind-notch"><path d="M40.5,83 L50,91.5 L59.5,83 L59.5,76 L50,84.5 L40.5,76 Z" fill="#2B2A26"/></g>
</svg>
