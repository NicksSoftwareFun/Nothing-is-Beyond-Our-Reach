<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-nibor="tokens/crew/crew-petty">
  <!-- Oren "Static" Petty - forty years of QSL cards. Pack body with antenna whip, bare head, pistol. -->
  <!-- base ring: crew (c-ring-crew) -->
  <circle cx="50" cy="50" r="46" fill="#F8F6EE" stroke="#D96C2E" stroke-width="6"/>
  <g id="c-body-pack">
    <rect x="-4.5" y="-16" width="9" height="32" rx="4.5" fill="#5B6244" stroke="#2B2A26" stroke-width="3" transform="translate(42.75,34) rotate(22)"/>
    <rect x="-4.5" y="-12" width="9" height="24" rx="4.5" fill="#5B6244" stroke="#2B2A26" stroke-width="3" transform="translate(57.25,40) rotate(-36)"/>
    <ellipse cx="50" cy="53" rx="27" ry="16" fill="#5B6244" stroke="#2B2A26" stroke-width="3"/>
    <rect x="34.5" y="62" width="31" height="25" rx="5" fill="#8A8F6A" stroke="#2B2A26" stroke-width="3"/>
    <line x1="41.5" y1="63.5" x2="41.5" y2="85.5" stroke="#2B2A26" stroke-width="1.5"/>
    <line x1="58.5" y1="63.5" x2="58.5" y2="85.5" stroke="#2B2A26" stroke-width="1.5"/>
    <path d="M63,64 C67,52 70.5,40 72.5,26" fill="none" stroke="#2B2A26" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g id="c-head-bare">
    <circle cx="50" cy="50" r="11" fill="#C9BA95" stroke="#2B2A26" stroke-width="3"/>
  </g>
  <g id="c-weapon-pistol">
    <rect x="47.6" y="28" width="4.8" height="3" fill="#2B2A26"/><rect x="46.4" y="31" width="7.2" height="26" rx="1" fill="#2B2A26"/><rect x="43.4" y="55" width="13.2" height="13.5" rx="3" fill="#2B2A26"/><rect x="45.2" y="52.5" width="9.6" height="4" fill="#2B2A26"/>
  </g>
  <!-- hands in a two-hand pistol grip (from c-body-pack, drawn over the weapon) -->
  <circle cx="47.3" cy="28.5" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <circle cx="52.7" cy="34" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- role badge: radio (ham) -->
  <rect x="71.5" y="71.5" width="22" height="22" rx="3" fill="#F8F6EE" stroke="#2B2A26" stroke-width="1.5"/>
  <g id="c-glyph-radio" transform="translate(73.7,73.7) scale(0.45)"><circle cx="11" cy="30" r="4" fill="#2B2A26"/><path d="M11,20.5 A9.5,9.5 0 0 1 20.5,30" fill="none" stroke="#2B2A26" stroke-width="3" stroke-linecap="round"/><path d="M11,14 A16,16 0 0 1 27,30" fill="none" stroke="#2B2A26" stroke-width="3" stroke-linecap="round"/><path d="M11,7.5 A22.5,22.5 0 0 1 33.5,30" fill="none" stroke="#2B2A26" stroke-width="3" stroke-linecap="round"/></g>
  <!-- c-blind-notch (rear) -->
  <g id="c-blind-notch"><path d="M40.5,83 L50,91.5 L59.5,83 L59.5,76 L50,84.5 L40.5,76 Z" fill="#2B2A26"/></g>
</svg>
