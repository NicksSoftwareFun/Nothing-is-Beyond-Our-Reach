<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-nibor="tokens/crew/crew-vasquez">
  <!-- Reyna Vasquez - Service vet, leader. Heavy body (plates), helmet, carbine. -->
  <!-- base ring: crew (c-ring-crew) -->
  <circle cx="50" cy="50" r="46" fill="#F8F6EE" stroke="#D96C2E" stroke-width="6"/>
  <!-- c-body-heavy (crew: olive clothing) - hands redrawn over the weapon below -->
  <g id="c-body-heavy">
    <rect x="-5" y="-17" width="10" height="34" rx="5" fill="#5B6244" stroke="#2B2A26" stroke-width="3" transform="translate(41.5,35.5) rotate(23)"/>
    <rect x="-5" y="-13" width="10" height="26" rx="5" fill="#5B6244" stroke="#2B2A26" stroke-width="3" transform="translate(58.5,42) rotate(-36)"/>
    <ellipse cx="50" cy="55" rx="31" ry="18" fill="#5B6244" stroke="#2B2A26" stroke-width="3"/>
    <polygon points="34,43 66,43 71.5,50 71.5,64 65.5,71 34.5,71 28.5,64 28.5,50" fill="#5B6244" stroke="#2B2A26" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- c-head-helmet -->
  <g id="c-head-helmet">
    <circle cx="50" cy="50" r="13.5" fill="#5B6244" stroke="#2B2A26" stroke-width="3"/>
    <circle cx="50" cy="50" r="9" fill="none" stroke="#2B2A26" stroke-width="1.5"/>
  </g>
  <!-- c-weapon-carbine -->
  <g id="c-weapon-carbine">
    <rect x="47.8" y="12" width="4.4" height="5" fill="#2B2A26"/><rect x="48.6" y="17" width="2.8" height="9" fill="#2B2A26"/><rect x="45.4" y="25.5" width="9.2" height="2.8" fill="#2B2A26"/><rect x="45.9" y="28.3" width="8.2" height="18" rx="2" fill="#2B2A26"/><rect x="44.4" y="46.3" width="11.2" height="16" rx="1.2" fill="#2B2A26"/><rect x="55.6" y="49.5" width="2.8" height="7" fill="#2B2A26"/><rect x="47.4" y="62.3" width="5.2" height="11" fill="#2B2A26"/><polygon points="44.8,73.3 55.2,73.3 56.6,85 43.4,85" fill="#2B2A26"/><rect x="42.6" y="85" width="14.8" height="3.6" rx="1" fill="#2B2A26"/>
  </g>
  <!-- hands on the grip (from c-body-heavy, drawn over the weapon) -->
  <circle cx="47.2" cy="24" r="4.4" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <circle cx="52.8" cy="34" r="4.4" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- role badge: leader -->
  <rect x="71.5" y="71.5" width="22" height="22" rx="3" fill="#F8F6EE" stroke="#2B2A26" stroke-width="1.5"/>
  <g id="c-glyph-leader" transform="translate(73.7,73.7) scale(0.45)">
    <path d="M8,17.5 L20,6 L32,17.5 L32,24.5 L20,13 L8,24.5 Z" fill="#2B2A26"/>
    <path d="M8,29.5 L20,18 L32,29.5 L32,36.5 L20,25 L8,36.5 Z" fill="#2B2A26"/>
  </g>
  <!-- c-blind-notch (rear) -->
  <g id="c-blind-notch"><path d="M40.5,83 L50,91.5 L59.5,83 L59.5,76 L50,84.5 L40.5,76 Z" fill="#2B2A26"/></g>
</svg>
