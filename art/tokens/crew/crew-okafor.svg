  <g id="c-body-pack">
    <rect x="-4.5" y="-16" width="9" height="32" rx="4.5" fill="#5B6244" stroke="#2B2A26" stroke-width="3" transform="translate(42.75,34) rotate(22)"/>
    <rect x="-4.5" y="-12" width="9" height="24" rx="4.5" fill="#5B6244" stroke="#2B2A26" stroke-width="3" transform="translate(57.25,40) rotate(-36)"/>
    <ellipse cx="50" cy="53" rx="27" ry="16" fill="#5B6244" stroke="#2B2A26" stroke-width="3"/>
    <rect x="34.5" y="62" width="31" height="25" rx="5" fill="#8A8F6A" stroke="#2B2A26" stroke-width="3"/>
    <line x1="41.5" y1="63.5" x2="41.5" y2="85.5" stroke="#2B2A26" stroke-width="1.5"/>
    <line x1="58.5" y1="63.5" x2="58.5" y2="85.5" stroke="#2B2A26" stroke-width="1.5"/>
  </g>
  <g id="c-head-helmet">
