<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-nibor="tokens/crew/crew-okafor">
  <!-- Tanya Okafor - co-op lineman. Pack body (tool load), hardhat reads as helmet, shotgun. -->
