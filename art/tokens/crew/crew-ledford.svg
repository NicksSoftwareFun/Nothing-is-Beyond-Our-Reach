<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-nibor="tokens/crew/crew-ledford">
  <!-- Junior Ledford - bear hunter. Standard body, hood (ghillie), hunting rifle. -->
  <!-- base ring: crew (c-ring-crew) -->
  <circle cx="50" cy="50" r="46" fill="#F8F6EE" stroke="#D96C2E" stroke-width="6"/>
  <g id="c-body-standard">
    <rect x="-4.5" y="-16" width="9" height="32" rx="4.5" fill="#5B6244" stroke="#2B2A26" stroke-width="3" transform="translate(42.75,36) rotate(22)"/>
    <rect x="-4.5" y="-12" width="9" height="24" rx="4.5" fill="#5B6244" stroke="#2B2A26" stroke-width="3" transform="translate(57.25,42) rotate(-36)"/>
    <ellipse cx="50" cy="55" rx="27" ry="16" fill="#5B6244" stroke="#2B2A26" stroke-width="3"/>
  </g>
  <g id="c-head-hood">
    <path d="M50,33.5 C60,36.5 64.5,44 64.5,51.5 C64.5,59.5 58,65 50,65 C42,65 35.5,59.5 35.5,51.5 C35.5,44 40,36.5 50,33.5 Z" fill="#5B6244" stroke="#2B2A26" stroke-width="3"/>
    <ellipse cx="50" cy="52.5" rx="7" ry="6.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  </g>
  <g id="c-weapon-hunting-rifle">
    <rect x="48" y="6" width="4" height="3" fill="#2B2A26"/><rect x="48.7" y="9" width="2.6" height="27" fill="#2B2A26"/><rect x="46.4" y="25.5" width="7.2" height="13" rx="3" fill="#2B2A26"/><rect x="47" y="38" width="6" height="24" fill="#2B2A26"/><rect x="44.6" y="39.5" width="10.8" height="7.5" rx="3.4" fill="#2B2A26"/><rect x="47.4" y="47" width="5.2" height="8.5" fill="#2B2A26"/><rect x="45.2" y="55.5" width="9.6" height="5.5" rx="2.4" fill="#2B2A26"/><rect x="53" y="48.5" width="5.6" height="3" rx="1.4" fill="#2B2A26"/><polygon points="46.4,62 53.6,62 55.8,92 44.2,92" fill="#2B2A26"/><rect x="43.8" y="92" width="12.4" height="4" rx="1.2" fill="#2B2A26"/>
  </g>
  <!-- hands on barrel and forestock (from c-body-standard, drawn over the weapon) -->
  <circle cx="47.3" cy="24" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <circle cx="52.7" cy="34" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- role badge: eye (hunter/stalker) -->
  <rect x="71.5" y="71.5" width="22" height="22" rx="3" fill="#F8F6EE" stroke="#2B2A26" stroke-width="1.5"/>
  <g id="c-glyph-eye" transform="translate(73.7,73.7) scale(0.45)"><path d="M4,20 Q20,7 36,20 Q20,33 4,20 Z M26.2,20 A6.2,6.2 0 1 0 13.8,20 A6.2,6.2 0 1 0 26.2,20 Z" fill="#2B2A26" fill-rule="nonzero"/><circle cx="20" cy="20" r="2.9" fill="#2B2A26"/></g>
  <!-- c-blind-notch (rear) -->
  <g id="c-blind-notch"><path d="M40.5,83 L50,91.5 L59.5,83 L59.5,76 L50,84.5 L40.5,76 Z" fill="#2B2A26"/></g>
</svg>
