<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 75 75" data-nibor="tokens/drones/drone-eca-dropper">
  <!-- ECA dropper - authority ring, sleek airframe, rust frag cylinder slung below the tail. -->
  <circle cx="37.5" cy="37.5" r="34" fill="#F8F6EE" stroke="#4A4E57" stroke-width="3"/>
  <!-- sleek rotor arms -->
  <line x1="37.5" y1="37.5" x2="22.5" y2="22.5" stroke="#2B2A26" stroke-width="1.5"/>
  <line x1="37.5" y1="37.5" x2="52.5" y2="22.5" stroke="#2B2A26" stroke-width="1.5"/>
  <line x1="37.5" y1="37.5" x2="22.5" y2="52.5" stroke="#2B2A26" stroke-width="1.5"/>
  <line x1="37.5" y1="37.5" x2="52.5" y2="52.5" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- rotors -->
  <circle cx="22.5" cy="22.5" r="8.5" fill="none" stroke="#2B2A26" stroke-width="1.5"/>
  <circle cx="52.5" cy="22.5" r="8.5" fill="none" stroke="#2B2A26" stroke-width="1.5"/>
  <circle cx="22.5" cy="52.5" r="8.5" fill="none" stroke="#2B2A26" stroke-width="1.5"/>
  <circle cx="52.5" cy="52.5" r="8.5" fill="none" stroke="#2B2A26" stroke-width="1.5"/>
  <circle cx="22.5" cy="22.5" r="1.8" fill="#2B2A26"/>
  <circle cx="52.5" cy="22.5" r="1.8" fill="#2B2A26"/>
  <circle cx="22.5" cy="52.5" r="1.8" fill="#2B2A26"/>
  <circle cx="52.5" cy="52.5" r="1.8" fill="#2B2A26"/>
  <!-- hanging frag cylinder (slung under, trails aft) -->
  <rect x="33.5" y="44" width="8" height="17" rx="3.5" fill="#9C4A38" stroke="#2B2A26" stroke-width="1.5"/>
  <line x1="34.2" y1="49" x2="40.8" y2="49" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- pointed airframe -->
  <polygon points="37.5,25 43,30 43,45 37.5,49 32,45 32,30" fill="#2B2A26"/>
</svg>
