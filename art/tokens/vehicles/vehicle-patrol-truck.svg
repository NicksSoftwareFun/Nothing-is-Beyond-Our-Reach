<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" data-nibor="tokens/vehicles/vehicle-patrol-truck">
  <!-- ECA Patrol Truck - authority edge band, olive crew-cab truck, applique plate hints on the cab, covered troop bed, whip antenna. -->
  <!-- faction edge band (stroke 6 rounded rect inset) -->
  <rect x="5" y="5" width="90" height="190" rx="12" fill="#F8F6EE" stroke="#4A4E57" stroke-width="6"/>
  <!-- tires -->
  <rect x="18.5" y="38" width="7.5" height="20" rx="2" fill="#2B2A26"/>
  <rect x="74" y="38" width="7.5" height="20" rx="2" fill="#2B2A26"/>
  <rect x="18.5" y="130" width="7.5" height="20" rx="2" fill="#2B2A26"/>
  <rect x="74" y="130" width="7.5" height="20" rx="2" fill="#2B2A26"/>
  <!-- truck body -->
  <rect x="26" y="24" width="48" height="152" rx="6" fill="#5B6244" stroke="#2B2A26" stroke-width="3"/>
  <!-- grille -->
  <rect x="38" y="25.5" width="24" height="4.5" fill="#4C4A42"/>
  <!-- hood line -->
  <line x1="27.5" y1="58" x2="72.5" y2="58" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- windshield band with cage bars -->
  <rect x="28" y="58" width="44" height="12" fill="#4C4A42" stroke="#2B2A26" stroke-width="1.5"/>
  <line x1="39" y1="58.5" x2="39" y2="69.5" stroke="#2B2A26" stroke-width="1.5"/>
  <line x1="50" y1="58.5" x2="50" y2="69.5" stroke="#2B2A26" stroke-width="1.5"/>
  <line x1="61" y1="58.5" x2="61" y2="69.5" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- mirrors -->
  <rect x="20" y="60" width="6" height="3" fill="#2B2A26"/>
  <rect x="74" y="60" width="6" height="3" fill="#2B2A26"/>
  <!-- crew-cab roof, door seam -->
  <rect x="29" y="70" width="42" height="50" rx="3" fill="#8A8F6A" stroke="#2B2A26" stroke-width="1.5"/>
  <line x1="29.5" y1="95" x2="70.5" y2="95" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- applique side plates on the cab -->
  <rect x="23.5" y="72" width="5" height="13" fill="#4C4A42" stroke="#2B2A26" stroke-width="1.5"/>
  <rect x="23.5" y="89" width="5" height="13" fill="#4C4A42" stroke="#2B2A26" stroke-width="1.5"/>
  <rect x="23.5" y="106" width="5" height="13" fill="#4C4A42" stroke="#2B2A26" stroke-width="1.5"/>
  <rect x="71.5" y="72" width="5" height="13" fill="#4C4A42" stroke="#2B2A26" stroke-width="1.5"/>
  <rect x="71.5" y="89" width="5" height="13" fill="#4C4A42" stroke="#2B2A26" stroke-width="1.5"/>
  <rect x="71.5" y="106" width="5" height="13" fill="#4C4A42" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- covered troop bed with canvas bows -->
  <rect x="30" y="124" width="40" height="48" fill="#8A8F6A" stroke="#2B2A26" stroke-width="1.5"/>
  <line x1="30.5" y1="136" x2="69.5" y2="136" stroke="#2B2A26" stroke-width="1.5"/>
  <line x1="30.5" y1="148" x2="69.5" y2="148" stroke="#2B2A26" stroke-width="1.5"/>
  <line x1="30.5" y1="160" x2="69.5" y2="160" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- whip antenna -->
  <line x1="66" y1="128" x2="72" y2="114" stroke="#2B2A26" stroke-width="1.5"/>
  <circle cx="72" cy="113" r="1.5" fill="#2B2A26"/>
</svg>
