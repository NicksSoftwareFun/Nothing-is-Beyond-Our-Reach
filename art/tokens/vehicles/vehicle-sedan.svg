<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" data-nibor="tokens/vehicles/vehicle-sedan">
  <!-- Civilian Sedan - neutral edge band, top-down nose up: hood / windshield / roof / rear window / trunk. -->
  <!-- faction edge band (stroke 6 rounded rect inset) -->
  <rect x="5" y="5" width="90" height="190" rx="12" fill="#F8F6EE" stroke="#C9BA95" stroke-width="6"/>
  <!-- tires -->
  <rect x="20.5" y="40" width="7.5" height="20" rx="2" fill="#2B2A26"/>
  <rect x="72" y="40" width="7.5" height="20" rx="2" fill="#2B2A26"/>
  <rect x="20.5" y="132" width="7.5" height="20" rx="2" fill="#2B2A26"/>
  <rect x="72" y="132" width="7.5" height="20" rx="2" fill="#2B2A26"/>
  <!-- sedan body -->
  <rect x="28" y="30" width="44" height="144" rx="10" fill="#A9A49A" stroke="#2B2A26" stroke-width="3"/>
  <!-- grille -->
  <rect x="40" y="31.5" width="20" height="4" fill="#4C4A42"/>
  <!-- hood line -->
  <line x1="29.5" y1="64" x2="70.5" y2="64" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- windshield band -->
  <rect x="30" y="64" width="40" height="12" fill="#4C4A42" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- mirrors -->
  <rect x="22" y="66" width="6" height="3" fill="#2B2A26"/>
  <rect x="72" y="66" width="6" height="3" fill="#2B2A26"/>
  <!-- cabin roof -->
  <rect x="31.5" y="76" width="37" height="50" rx="6" fill="#BFB8A8" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- rear window band -->
  <rect x="30" y="126" width="40" height="10" fill="#4C4A42" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- trunk lid line -->
  <line x1="29.5" y1="166" x2="70.5" y2="166" stroke="#2B2A26" stroke-width="1.5"/>
</svg>
