<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-nibor="tokens/support/support-guide">
  <!-- Local Guide - knows the quiet ground. Standard body, hood, no weapon. -->
  <!-- base ring: neutral (c-ring-neutral) + inner crew liner -->
  <circle cx="50" cy="50" r="46" fill="#F8F6EE" stroke="#C9BA95" stroke-width="6"/>
  <!-- thin inner crew-orange ring: ours, but simplified (spec) -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#D96C2E" stroke-width="1.5"/>
  <g id="c-body-standard">
    <rect x="-4.5" y="-16" width="9" height="32" rx="4.5" fill="#5B6244" stroke="#2B2A26" stroke-width="3" transform="translate(42.75,36) rotate(22)"/>
    <rect x="-4.5" y="-12" width="9" height="24" rx="4.5" fill="#5B6244" stroke="#2B2A26" stroke-width="3" transform="translate(57.25,42) rotate(-36)"/>
    <ellipse cx="50" cy="55" rx="27" ry="16" fill="#5B6244" stroke="#2B2A26" stroke-width="3"/>
  </g>
  <g id="c-head-hood">
    <path d="M50,33.5 C60,36.5 64.5,44 64.5,51.5 C64.5,59.5 58,65 50,65 C42,65 35.5,59.5 35.5,51.5 C35.5,44 40,36.5 50,33.5 Z" fill="#5B6244" stroke="#2B2A26" stroke-width="3"/>
    <ellipse cx="50" cy="52.5" rx="7" ry="6.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  </g>
  <!-- hands (from the body component) -->
  <circle cx="47.5" cy="23" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <circle cx="52.5" cy="33" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- role badge: eye (guide) -->
  <rect x="71.5" y="71.5" width="22" height="22" rx="3" fill="#F8F6EE" stroke="#2B2A26" stroke-width="1.5"/>
  <g id="c-glyph-eye" transform="translate(73.7,73.7) scale(0.45)"><path d="M4,20 Q20,7 36,20 Q20,33 4,20 Z M26.2,20 A6.2,6.2 0 1 0 13.8,20 A6.2,6.2 0 1 0 26.2,20 Z" fill="#2B2A26" fill-rule="nonzero"/><circle cx="20" cy="20" r="2.9" fill="#2B2A26"/></g>
  <!-- c-blind-notch (rear) -->
  <g id="c-blind-notch"><path d="M40.5,83 L50,91.5 L59.5,83 L59.5,76 L50,84.5 L40.5,76 Z" fill="#2B2A26"/></g>
</svg>
