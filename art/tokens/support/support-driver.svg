<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-nibor="tokens/support/support-driver">
  <!-- Volunteer Driver - will not leave the vehicle. Standard body (both arms to the wheel), cap, no weapon. -->
  <!-- base ring: neutral (c-ring-neutral) + inner crew liner -->
  <circle cx="50" cy="50" r="46" fill="#F8F6EE" stroke="#C9BA95" stroke-width="6"/>
  <!-- thin inner crew-orange ring: ours, but simplified (spec) -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#D96C2E" stroke-width="1.5"/>
  <g id="c-body-standard">
    <rect x="-4.5" y="-14" width="9" height="28" rx="4.5" fill="#5B6244" stroke="#2B2A26" stroke-width="3" transform="translate(42.5,37) rotate(-14)"/>
    <rect x="-4.5" y="-14" width="9" height="28" rx="4.5" fill="#5B6244" stroke="#2B2A26" stroke-width="3" transform="translate(57.5,37) rotate(14)"/>
    <ellipse cx="50" cy="55" rx="27" ry="16" fill="#5B6244" stroke="#2B2A26" stroke-width="3"/>
  </g>
  <g id="c-head-cap">
    <path d="M35.5,44.24 A16,16 0 0 1 64.5,44.24 L58.61,46.99 A9.5,9.5 0 0 0 41.39,46.99 Z" fill="#5B6244" stroke="#2B2A26" stroke-width="1.5"/>
    <circle cx="50" cy="51" r="11" fill="#5B6244" stroke="#2B2A26" stroke-width="3"/>
    <circle cx="50" cy="51" r="1.8" fill="#2B2A26"/>
  </g>
  <!-- wheel arc in place of a weapon (spec: hands at wheel) -->
  <g id="c-wheel-arc"><path d="M34,32 A19,19 0 0 1 66,32" fill="none" stroke="#2B2A26" stroke-width="3" stroke-linecap="round"/></g>
  <!-- hands at the wheel arc (drawn over it) -->
  <circle cx="41" cy="26.5" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <circle cx="59" cy="26.5" r="4.2" fill="#C9BA95" stroke="#2B2A26" stroke-width="1.5"/>
  <!-- role badge: gear (driver) -->
  <rect x="71.5" y="71.5" width="22" height="22" rx="3" fill="#F8F6EE" stroke="#2B2A26" stroke-width="1.5"/>
  <g id="c-glyph-gear" transform="translate(73.7,73.7) scale(0.45)"><path d="M30.77,23.09 L35.61,22.47 L35.61,17.53 L30.77,16.91 L29.8,14.57 L32.78,10.71 L29.29,7.22 L25.43,10.2 L23.09,9.23 L22.47,4.39 L17.53,4.39 L16.91,9.23 L14.57,10.2 L10.71,7.22 L7.22,10.71 L10.2,14.57 L9.23,16.91 L4.39,17.53 L4.39,22.47 L9.23,23.09 L10.2,25.43 L7.22,29.29 L10.71,32.78 L14.57,29.8 L16.91,30.77 L17.53,35.61 L22.47,35.61 L23.09,30.77 L25.43,29.8 L29.29,32.78 L32.78,29.29 L29.8,25.43 Z M24.6,20 A4.6,4.6 0 1 1 15.4,20 A4.6,4.6 0 1 1 24.6,20 Z" fill="#2B2A26" fill-rule="evenodd"/></g>
  <!-- c-blind-notch (rear) -->
  <g id="c-blind-notch"><path d="M40.5,83 L50,91.5 L59.5,83 L59.5,76 L50,84.5 L40.5,76 Z" fill="#2B2A26"/></g>
</svg>
