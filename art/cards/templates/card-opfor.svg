<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" data-nibor="cards/templates/card-opfor">
  <!-- OPFOR spotting card template. 300 u/in - stroke weights scaled x3 (hairline 2.25, detail 4.5, standard 9). -->
  <!-- The build recolors the data-band rect per faction (palette factions group); default authority slate. -->
  <!-- Field sizing proven against data/opfor.yaml: name "ECA MG TEAM (GUNNER + AG)" 606u @38; doctrine "BASE-OF-FIRE" 196u @26; special eca-srt/coc-technical 86-87 ch = 2 lines @26 (box holds 7); element "fireteam of 4 with eca-team-leader" 334u @22. -->
  <rect x="0" y="0" width="750" height="1050" fill="#F2EDDF"/>
  <!-- frame: 24u paper margin, ink border (standard) -->
  <rect x="24" y="24" width="702" height="1002" fill="#F8F6EE" stroke="#2B2A26" stroke-width="9"/>
  <!-- header band: faction color (build recolors) -->
  <rect data-band x="28.5" y="28.5" width="693" height="96" fill="#4A4E57"/>
  <rect data-field="name" x="48" y="44" width="650" height="66" fill="none"/>
  <text x="52" y="92" font-family='"Oswald", "Liberation Sans", sans-serif' font-weight="600" font-size="38" letter-spacing="1.5" fill="#F8F6EE">{{name}}</text>
  <!-- faction -->
  <rect data-field="faction" x="48" y="138" width="420" height="36" fill="none"/>
  <text x="52" y="166" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="600" font-size="26" letter-spacing="1.5" fill="#4C4A42">{{faction}}</text>
  <!-- stat boxes -->
  <rect x="48" y="190" width="190" height="120" fill="#F2EDDF" stroke="#2B2A26" stroke-width="4.5"/>
  <text x="143" y="218" text-anchor="middle" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="600" font-size="18" letter-spacing="1.5" fill="#4C4A42">SHOOT</text>
  <rect data-field="shoot" x="56" y="228" width="174" height="60" fill="none"/>
  <text x="143" y="278" text-anchor="middle" font-family='"Oswald", "Liberation Sans", sans-serif' font-weight="600" font-size="50" fill="#2B2A26">{{shoot}}</text>
  <text x="143" y="300" text-anchor="middle" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="400" font-size="14" letter-spacing="1" fill="#4C4A42">OPEN / COVER</text>
  <rect x="250" y="190" width="98" height="120" fill="#F2EDDF" stroke="#2B2A26" stroke-width="4.5"/>
  <text x="299" y="218" text-anchor="middle" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="600" font-size="18" letter-spacing="1.5" fill="#4C4A42">GRIT</text>
  <rect data-field="grit" x="256" y="228" width="86" height="60" fill="none"/>
  <text x="299" y="280" text-anchor="middle" font-family='"Oswald", "Liberation Sans", sans-serif' font-weight="600" font-size="50" fill="#2B2A26">{{grit}}</text>
  <rect x="360" y="190" width="98" height="120" fill="#F2EDDF" stroke="#2B2A26" stroke-width="4.5"/>
  <text x="409" y="218" text-anchor="middle" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="600" font-size="18" letter-spacing="1.5" fill="#4C4A42">ARMOR</text>
  <rect data-field="armor" x="366" y="228" width="86" height="60" fill="none"/>
  <text x="409" y="280" text-anchor="middle" font-family='"Oswald", "Liberation Sans", sans-serif' font-weight="600" font-size="50" fill="#2B2A26">{{armor}}</text>
  <rect x="470" y="190" width="232" height="120" fill="#F2EDDF" stroke="#2B2A26" stroke-width="4.5"/>
  <text x="586" y="218" text-anchor="middle" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="600" font-size="18" letter-spacing="1.5" fill="#4C4A42">DOCTRINE</text>
  <rect data-field="doctrine" x="478" y="236" width="216" height="52" fill="none"/>
  <text x="586" y="272" text-anchor="middle" font-family='"Oswald", "Liberation Sans", sans-serif' font-weight="600" font-size="26" letter-spacing="1" fill="#2B2A26">{{doctrine}}</text>
  <!-- weapon -->
  <text x="52" y="352" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="600" font-size="20" letter-spacing="2" fill="#2B2A26">WEAPON</text>
  <line x1="48" y1="362" x2="702" y2="362" stroke="#2B2A26" stroke-width="2.25"/>
  <rect data-field="weapon" x="48" y="374" width="654" height="48" fill="none"/>
  <text x="52" y="410" font-family='"Oswald", "Liberation Sans", sans-serif' font-weight="500" font-size="30" letter-spacing="1" fill="#2B2A26">{{weapon}}</text>
  <!-- special -->
  <text x="52" y="470" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="600" font-size="20" letter-spacing="2" fill="#2B2A26">SPECIAL</text>
  <line x1="48" y1="480" x2="702" y2="480" stroke="#2B2A26" stroke-width="2.25"/>
  <rect data-field="special" x="48" y="492" width="654" height="260" fill="none"/>
  <text x="52" y="528" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="400" font-size="26" fill="#2B2A26">{{special}}</text>
  <!-- element -->
  <text x="52" y="816" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="600" font-size="20" letter-spacing="2" fill="#2B2A26">ELEMENT</text>
  <line x1="48" y1="826" x2="702" y2="826" stroke="#2B2A26" stroke-width="2.25"/>
  <rect data-field="element" x="48" y="838" width="654" height="44" fill="none"/>
  <text x="52" y="868" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="400" font-size="22" fill="#4C4A42">{{element}}</text>
  <!-- footer -->
  <line x1="48" y1="994" x2="702" y2="994" stroke="#4C4A42" stroke-width="2.25"/>
  <text x="52" y="1016" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="500" font-size="15" letter-spacing="2.5" fill="#4C4A42">OPFOR SPOTTING CARD</text>
  <text x="698" y="1016" text-anchor="end" font-family='"Oswald", "Liberation Sans", sans-serif' font-weight="600" font-size="17" letter-spacing="2" fill="#4A4E57">OPFOR</text>
</svg>
