<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" data-nibor="cards/templates/card-crew">
  <!-- Crew roster card template. 300 u/in - stroke weights scaled x3 (hairline 2.25, detail 4.5, standard 9). -->
  <rect x="0" y="0" width="750" height="1050" fill="#F2EDDF"/>
  <!-- frame: 24u paper margin, ink border (standard) -->
  <rect x="24" y="24" width="702" height="1002" fill="#F8F6EE" stroke="#2B2A26" stroke-width="9"/>
  <!-- header band: crew -->
  <rect x="28.5" y="28.5" width="693" height="96" fill="#D96C2E"/>
  <rect data-field="name" x="48" y="44" width="420" height="66" fill="none"/>
  <text x="52" y="94" font-family='"Oswald", "Liberation Sans", sans-serif' font-weight="600" font-size="44" letter-spacing="1.5" fill="#F8F6EE">{{name}}</text>
  <rect data-field="callsign" x="480" y="56" width="218" height="44" fill="none"/>
  <text x="698" y="92" text-anchor="end" font-family='"Oswald", "Liberation Sans", sans-serif' font-weight="500" font-size="26" letter-spacing="1" fill="#F8F6EE">{{callsign}}</text>
  <!-- tier -->
  <rect data-field="tier" x="48" y="138" width="300" height="36" fill="none"/>
  <text x="52" y="166" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="600" font-size="26" letter-spacing="1.5" fill="#4C4A42">{{tier}}</text>
  <!-- stat boxes -->
  <rect x="48" y="190" width="190" height="120" fill="#F2EDDF" stroke="#2B2A26" stroke-width="4.5"/>
  <text x="143" y="218" text-anchor="middle" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="600" font-size="18" letter-spacing="1.5" fill="#4C4A42">SHOOT</text>
  <rect data-field="shoot" x="56" y="228" width="174" height="60" fill="none"/>
  <text x="143" y="278" text-anchor="middle" font-family='"Oswald", "Liberation Sans", sans-serif' font-weight="600" font-size="50" fill="#2B2A26">{{shoot}}</text>
  <text x="143" y="300" text-anchor="middle" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="400" font-size="14" letter-spacing="1" fill="#4C4A42">OPEN / COVER</text>
  <rect x="250" y="190" width="98" height="120" fill="#F2EDDF" stroke="#2B2A26" stroke-width="4.5"/>
  <text x="299" y="218" text-anchor="middle" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="600" font-size="18" letter-spacing="1.5" fill="#4C4A42">GRIT</text>
  <rect data-field="grit" x="256" y="228" width="86" height="60" fill="none"/>
  <text x="299" y="280" text-anchor="middle" font-family='"Oswald", "Liberation Sans", sans-serif' font-weight="600" font-size="50" fill="#2B2A26">{{grit}}</text>
  <rect x="360" y="190" width="98" height="120" fill="#F2EDDF" stroke="#2B2A26" stroke-width="4.5"/>
  <text x="409" y="218" text-anchor="middle" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="600" font-size="18" letter-spacing="1.5" fill="#4C4A42">AP</text>
  <rect data-field="ap" x="366" y="228" width="86" height="60" fill="none"/>
  <text x="409" y="280" text-anchor="middle" font-family='"Oswald", "Liberation Sans", sans-serif' font-weight="600" font-size="50" fill="#2B2A26">{{ap}}</text>
  <!-- bust slot 220x220 top-right -->
  <g data-slot="bust">
    <rect x="482" y="144" width="220" height="220" fill="#F2EDDF" stroke="#2B2A26" stroke-width="4.5"/>
    <line x1="580" y1="254" x2="604" y2="254" stroke="#A38B66" stroke-width="2.25"/>
    <line x1="592" y1="242" x2="592" y2="266" stroke="#A38B66" stroke-width="2.25"/>
  </g>
  <!-- skills -->
  <text x="52" y="404" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="600" font-size="20" letter-spacing="2" fill="#2B2A26">SKILLS</text>
  <line x1="48" y1="414" x2="702" y2="414" stroke="#2B2A26" stroke-width="2.25"/>
  <rect data-field="skills" x="48" y="426" width="654" height="320" fill="none"/>
  <text x="52" y="464" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="400" font-size="24" fill="#2B2A26">{{skills}}</text>
  <!-- gear -->
  <text x="52" y="776" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="600" font-size="20" letter-spacing="2" fill="#2B2A26">GEAR</text>
  <line x1="48" y1="786" x2="702" y2="786" stroke="#2B2A26" stroke-width="2.25"/>
  <rect data-field="gear" x="48" y="796" width="654" height="56" fill="none"/>
  <text x="52" y="830" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="400" font-size="24" fill="#2B2A26">{{gear}}</text>
  <!-- bio -->
  <line x1="48" y1="874" x2="702" y2="874" stroke="#2B2A26" stroke-width="2.25"/>
  <rect data-field="bio" x="48" y="884" width="654" height="100" fill="none"/>
  <text x="52" y="916" font-family='"Source Serif 4", "Bitstream Charter", serif' font-style="italic" font-size="24" fill="#4C4A42">{{bio}}</text>
  <!-- footer -->
  <line x1="48" y1="994" x2="702" y2="994" stroke="#4C4A42" stroke-width="2.25"/>
  <text x="52" y="1016" font-family='"Barlow Semi Condensed", "Liberation Sans", sans-serif' font-weight="500" font-size="15" letter-spacing="2.5" fill="#4C4A42">VOLUNTEER ROSTER CARD</text>
  <text x="698" y="1016" text-anchor="end" font-family='"Oswald", "Liberation Sans", sans-serif' font-weight="600" font-size="17" letter-spacing="2" fill="#D96C2E">CREW</text>
</svg>
